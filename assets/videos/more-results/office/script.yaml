global_caption: In a sleek, modern open-plan office with glass partitions and rows
  of glowing monitors, two colleagues—Jacob, an athletic man in his early 40s with
  wavy brown hair pushed back, stubble, and a navy pea coat, and Mei, a petite woman
  in her late 20s with straight shoulder-length black hair, almond eyes, and a lavender
  cashmere sweater—tackle a demanding design project together. Their contrasting presences
  and work styles create a dynamic atmosphere as they collaborate intensely, each
  bringing unique energy to the workspace.
