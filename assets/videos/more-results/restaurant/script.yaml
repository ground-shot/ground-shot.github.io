shots:
- shot_id: 1
  text: A close-up reveals the man's furrowed brow and receding brown hair, his thin-framed
    glasses reflecting the candle's flicker. He shifts uneasily, adjusting his navy
    blue cardigan, fingers fidgeting atop the checkered shirt. His eyes dart towards
    the entrance, lips pressed tight as he readies himself for what's coming.
  duration_seconds: 4.0
  shot_type: close-up
  lighting: low_key
  camera_angle: frontal
  characters_present:
  - char_01
- shot_id: 2
  text: Framed in a medium shot, the woman stands just inside the doorway, her long
    wavy auburn hair cascading over the olive green military-style parka. Freckles
    dot her nose, and green eyes scan the tables, searching for a familiar face. She
    inhales deeply, shoulders squared as she steels herself for the meeting.
  duration_seconds: 4.0
  shot_type: medium
  lighting: low_key
  camera_angle: frontal
  characters_present:
  - char_02
- shot_id: 3
  text: The camera widens to show both characters at opposite ends of the restaurant
    table. The man, cardigan collar askew, offers a tentative nod. Across from him,
    the woman’s parka sleeves are clenched in her fists. White tablecloths and candles
    set the stage, tension thick between them as conversation falters.
  duration_seconds: 4.0
  shot_type: wide
  lighting: low_key
  camera_angle: frontal
  characters_present:
  - char_01
  - char_02
- shot_id: 4
  text: Warm indoor light bathes the man as he sits alone, cardigan bunched around
    his elbows. He stares into his untouched glass of water, tracing patterns on the
    tablecloth, lost in thought. The bustle of the restaurant fades into background,
    isolating him in his own worries.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_warm
  camera_angle: frontal
  characters_present:
  - char_01
- shot_id: 5
  text: Medium shot brings both back into focus, the woman’s parka and the man’s cardigan
    unmistakable. She leans forward, voice barely above a whisper, earnestness in
    her freckled face. He listens, glasses lowered, and the candlelight softens their
    expressions as the confrontation finally begins to thaw.
  duration_seconds: 4.0
  shot_type: medium
  lighting: low_key
  camera_angle: frontal
  characters_present:
  - char_01
  - char_02
