global_caption: In the upscale restaurant dining area, late 30s male with receding
  brown hair, thin-framed glasses, a slight paunch, and a navy blue cardigan over
  a checkered shirt waits anxiously. Across the room, a mid 20s female with long wavy
  auburn hair, freckles across her nose, striking green eyes, and an olive green military-style
  parka enters, bracing for an inevitable confrontation. Their uneasy reunion unfolds
  amid dim candlelight and pristine white tablecloths, as both struggle to navigate
  the tension between them.
