- shot_id: 5
  text: In a close-up, char_01’s khaki jacket sleeve brushes against char_02’s olive
    utility jacket. Their faces are inches apart, expressions guarded. Char_02’s deep-set
    eyes flicker with resolve; char_01’s jaw clenches. Sunlight returns, illuminating
    their features and marking the subtle distinction in their rivalry, as if each
    is measuring the other’s resolve in the charged silence.
