  - char_01
  - char_02
- shot_id: 4
  text: A medium shot reveals char_01 in his khaki field jacket, standing near a stack
    of rebar. He glances sideways, lips pressed thin, as he observes activity from
    afar. His posture remains upright, military straight, while shadows from overhead
    beams stretch across the cracked concrete. Dust motes drift in the air, highlighting
    his unwavering vigilance.
  duration_seconds: 4.0
