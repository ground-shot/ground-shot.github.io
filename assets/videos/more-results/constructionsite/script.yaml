- shot_id: 3
  text: Overcast light softens the edges as both men face each other in a tight close-up.
    Char_01’s khaki field jacket contrasts with char_02’s olive drab utility jacket,
    their eyes locked and searching. Beads of sweat dot their brows; the tension is
    palpable. Neither speaks, but the rivalry between the two is clear in their silent
    exchange, the construction site’s noise muffled by their intensity.
  duration_seconds: 4.0
  shot_type: close-up
