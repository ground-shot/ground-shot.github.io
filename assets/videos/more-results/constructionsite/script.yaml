global_caption: At a bustling construction site, two men—both fit, grey-haired, and
  exuding authority—draw attention through their subtle rivalry. The first, char_01,
  is in his early sixties with a grey crew cut and military bearing, his khaki field
  jacket bristling with pockets. The second, char_02, is a tall man in his mid forties
  with short grey hair, a square jaw, and deep-set brown eyes, dressed in an olive
  drab utility jacket. Their interactions reveal a story of mutual observation and
  unspoken competition amid scaffolding and cranes.
