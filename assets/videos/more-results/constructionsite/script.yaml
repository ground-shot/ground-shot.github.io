- shot_id: 2
  text: Close up, char_02’s deep-set brown eyes glint with intensity. His square jaw
    tenses as he leans forward, the olive drab utility jacket tight across his tall,
    fit frame. Concrete pillars rise behind him, unfinished and raw. The camera lingeres
    on his short grey hair, emphasizing his watchful gaze as he focuses intently on
    movement in the distance.
  duration_seconds: 4.0
  shot_type: close-up
