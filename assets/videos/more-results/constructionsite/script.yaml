  text: Sunlight washes over the construction site as char_01 stands framed by scaffolding,
    his grey crew cut and fit build unmistakable. He surveys the area with a clean-shaven
    jaw set firm, hands resting in the pockets of his khaki field jacket. Cranes loom
    behind him, dust swirling at his feet, amplifying his military bearing as he scans
    the chaos for something—or someone.
  duration_seconds: 4.0
