global_caption: In a modest apartment living room filled with warm light and city
  views, three distinct friends—an early 60s woman with short grey curls, bright blue
  eyes, rosy cheeks, and a powder blue down jacket; an early 30s stocky man with a
  thick black mustache, warm complexion, and brown leather bomber jacket; and a mid-20s
  woman with voluminous curly dark hair, bronze skin, a bright smile, and a turquoise
  wrap dress—share a rare peaceful afternoon together. As they settle in, the group
  revels in quiet camaraderie, each savoring the moment in their own unique way.
