shots:
- shot_id: 1
  text: In a medium, low-key frontal shot, all three friends sit closely on the worn
    sofa. The early 60s woman, her short grey curls framing bright blue eyes and rosy
    cheeks, chats softly with the stocky man whose thick black mustache and brown
    bomber jacket catch the light. Beside them, the young woman in a turquoise wrap
    dress beams, her voluminous dark curls spilling over her shoulder as she listens.
  duration_seconds: 4.0
  shot_type: medium
  lighting: low_key
  camera_angle: frontal
  characters_present:
  - char_01
  - char_02
  - char_03
- shot_id: 2
  text: The wide, frontal frame focuses solely on the man in the brown bomber jacket.
    He leans against the bookshelf, hands tucked in his pockets, his thick mustache
    twitching as he smiles quietly at something unsaid. The golden indoor light bathes
    his warm complexion, and the city glows behind the window, hinting at the comfort
    inside.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_warm
  camera_angle: frontal
  characters_present:
  - char_02
- shot_id: 3
  text: From a wide, frontal perspective, the woman in the turquoise wrap dress stands
    near the window, her bronze skin illuminated by the indoor lights. She gazes out
    at the skyline, her bright smile fading into thoughtful serenity, fingers trailing
    absentmindedly along the glass as her voluminous curls catch the glow.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_warm
  camera_angle: frontal
  characters_present:
  - char_03
- shot_id: 4
  text: With indoor neutral lighting, the camera captures all three friends sprawled
    across the sofa in a wide shot. The powder blue down jacket is draped over the
    early 60s woman’s lap, while the brown bomber jacketed man playfully nudges her,
    and the turquoise dress-clad woman laughs, her curls bouncing as she leans forward.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_neutral
  camera_angle: frontal
  characters_present:
  - char_01
  - char_02
  - char_03
- shot_id: 5
  text: The scene shifts subtly as the friends settle deeper into the sofa. The woman
    in the powder blue jacket glances at the man’s bomber jacket, her eyes twinkling,
    while the turquoise dress stands out against the bookshelves. Nobody speaks; instead,
    their relaxed postures and gentle smiles communicate the unspoken joy of being
    together.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_neutral
  camera_angle: frontal
  characters_present:
  - char_01
  - char_02
  - char_03
- shot_id: 6
  text: In the final wide shot, the group sits in comfortable silence, the neutral
    indoor light casting soft shadows. The early 60s woman’s powder blue jacket, the
    man’s brown bomber, and the woman’s turquoise dress create a tapestry of color
    as hands meet over a steaming teapot, savoring one last sip in peaceful harmony.
  duration_seconds: 4.0
  shot_type: wide
  lighting: indoor_neutral
  camera_angle: frontal
